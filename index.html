<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A to Z Nutrition</title>
  <meta name="description" content="A to Z Nutrition, Las Vegas. Coming soon.">
  <meta name="theme-color" content="#f7f5f0">
  <style>
    :root {
      --bg: #f7f5f0;
      --ink: #1f2a24;
      --muted: #5b6660;
      --line: #d9d5cc;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141815; --ink: #eef1ec; --muted: #a7b0aa; --line: #2c332e; }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }
    main { width: 100%; max-width: 32rem; }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 8vw, 3rem);
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: -0.01em;
      overflow-wrap: anywhere;
    }
    p { margin: 0; color: var(--muted); }
    .rule { width: 48px; height: 2px; background: var(--line); margin: 20px auto; border: 0; }
    footer { margin-top: 40px; font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>A to Z Nutrition</h1>
    <hr class="rule">
    <p>Coming soon.</p>
  </main>
  <footer>Las Vegas</footer>
</body>
</html>
