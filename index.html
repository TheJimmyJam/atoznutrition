<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A to Z Nutrition</title>
  <meta name="description" content="A to Z Nutrition, Las Vegas.">
  <meta name="theme-color" content="#f7f5f0">
  <link rel="stylesheet" href="/site.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main id="profile" class="col">
    <header class="who">
      <h1 id="name">A to Z Nutrition</h1>
      <p id="owner" class="owner" hidden></p>
      <p id="tagline" class="tagline" hidden></p>
    </header>
    <p id="about" class="about" hidden></p>
    <section id="services" class="services" hidden aria-labelledby="services-title">
      <h2 id="services-title" data-word="page.services">Services</h2>
      <ul id="service-list" class="grid"></ul>
    </section>
    <button id="work" class="primary" type="button" data-word="page.work">Work with me</button>
    <p id="load-failed" class="note" role="alert" hidden></p>
  </main>

  <main id="flow" class="col" hidden>
    <div class="bar">
      <button id="back" class="quiet" type="button" data-word="page.back">Back</button>
      <span id="step" class="step" aria-live="polite"></span>
      <button id="close" class="quiet" type="button" data-word="page.close">Close</button>
    </div>
    <section id="question" class="panel" hidden>
      <h2 id="q-title"></h2>
      <ul id="q-options" class="options"></ul>
    </section>
    <form id="contact" class="panel" hidden novalidate>
      <h2 data-word="page.contact">Where can I reach you?</h2>
      <label class="field"><span data-word="page.name">Your name</span>
        <input id="f-name" name="name" type="text" autocomplete="name" maxlength="120" required></label>
      <label class="field"><span data-word="page.email">Email</span>
        <input id="f-email" name="email" type="email" autocomplete="email" maxlength="254" required></label>
      <label class="field"><span data-word="page.phone">Phone (optional)</span>
        <input id="f-phone" name="phone" type="tel" autocomplete="tel" maxlength="31"></label>
      <label class="check"><input id="f-tips" name="tips" type="checkbox"> <span data-word="page.tips">Send me tips by email</span></label>
      <div class="pot" aria-hidden="true"><label>Website <input id="f-website" name="website" type="text" tabindex="-1" autocomplete="off"></label></div>
      <p id="send-failed" class="note" role="alert" hidden></p>
      <button id="send" class="primary" type="submit" data-word="page.send">Send</button>
    </form>
    <section id="done" class="panel" hidden>
      <h2 id="done-title"></h2>
      <a id="done-link" class="primary" hidden></a>
      <p id="done-later" class="note" hidden></p>
    </section>
  </main>

  <footer id="where" class="col foot" hidden></footer>
</body>
</html>
